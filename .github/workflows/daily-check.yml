name: Daily check

on:
  schedule:
    - cron: '17 12 * * *'   # about 7:17 AM New York (8:17 in summer)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apps Script and page must match
        run: ./scripts/check-version.sh
      - name: The live page is the one in this repository
        run: |
          WANT=$(grep -oE "PAGE_LEVEL: *[0-9]+" config.js | grep -oE "[0-9]+$")
          LIVE=$(curl -sSL --max-time 60 "https://scelzags-png.github.io/sva-maintenance/config.js" | grep -oE "PAGE_LEVEL: *[0-9]+" | grep -oE "[0-9]+$" || true)
          echo "Repository page level: $WANT, live page level: ${LIVE:-none}"
          [ "$WANT" = "$LIVE" ] || { echo "::error::The live page is not the latest version. Re-run 'Check and publish'."; exit 1; }
